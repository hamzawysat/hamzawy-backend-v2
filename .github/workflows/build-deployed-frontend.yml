name: Build deployed frontend assets

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'scripts/build-frontend.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-deployed-frontend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'scripts/build-frontend.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-deployed-frontend.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-deployed-frontend-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  build-and-commit:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out pull request branch or main
        uses: actions/checkout@v5
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || 'main' }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build deployed frontend
        run: npm run build

      - name: Verify generated output
        run: |
          test -d frontend-dist
          test -n "$(find frontend-dist -type f -print -quit)"
          git status --short frontend-dist

      - name: Commit generated frontend-dist
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || 'main' }}
        run: |
          if [ -z "$(git status --porcelain -- frontend-dist)" ]; then
            echo "frontend-dist is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-dist
          git commit -m "build: refresh deployed frontend assets"
          git push origin "HEAD:${TARGET_BRANCH}"
