name: Build frontend-dist for unified subscriptions

on:
  push:
    branches:
      - fix/unified-subscription-store-admin-20261127
    paths:
      - 'frontend/**'
      - 'scripts/build-frontend.js'
      - '.github/workflows/subscriptions-frontend-build.yml'

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/unified-subscription-store-admin-20261127
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build minified frontend-dist
        run: npm run build
      - name: Commit generated frontend-dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-dist
          if git diff --cached --quiet; then
            echo "frontend-dist already matches the build output"
          else
            git commit -m "Build frontend-dist for unified subscriptions"
            git push origin HEAD:fix/unified-subscription-store-admin-20261127
          fi
