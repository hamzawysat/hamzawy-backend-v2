name: Temporary subscriptions branch build and verification

on:
  push:
    branches: [feat/subscriptions-fix-nav]
    paths:
      - 'frontend/**'
      - 'src/routes/subscriptions.js'
      - '.github/workflows/subscriptions-fix-nav-build.yml'

permissions:
  contents: write

jobs:
  build-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/subscriptions-fix-nav
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check changed JavaScript syntax
        run: |
          for file in frontend/js/client-core.js frontend/js/client-render.js frontend/js/client-commerce.js frontend/js/fanni-core.js frontend/js/fanni-offers.js frontend/js/fanni-orders.js frontend/js/fanni-render.js frontend/js/admin-core.js frontend/js/admin-commerce.js src/routes/subscriptions.js; do
            node --check "$file"
          done
      - name: Build frontend-dist
        run: npm run build
      - name: Commit built frontend assets to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-dist
          if ! git diff --cached --quiet; then
            git commit -m "Build frontend-dist for unified subscriptions"
            git push origin HEAD:feat/subscriptions-fix-nav
          fi
      - name: Run technician UI regression tests
        run: npm run test:registration-ui
      - name: Run backend integration and security tests
        run: npm test
      - name: Check high and critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Remove temporary build workflow
        if: always()
        run: |
          git rm -f .github/workflows/subscriptions-fix-nav-build.yml || true
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Remove temporary subscriptions build workflow"
            git push origin HEAD:feat/subscriptions-fix-nav
          fi
