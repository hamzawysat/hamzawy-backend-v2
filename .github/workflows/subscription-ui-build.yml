name: Build subscription UI assets
on:
  push:
    branches: [fix/subscription-choice-ui-admin-runtime-20261127]
    paths:
      - 'frontend/**'
      - '.github/workflows/subscription-ui-build.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/subscription-choice-ui-admin-runtime-20261127
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Commit built frontend assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-dist
          if git diff --cached --quiet; then echo "No generated asset changes"; exit 0; fi
          git commit -m "Build subscription choice UI assets"
          git push origin HEAD:fix/subscription-choice-ui-admin-runtime-20261127
