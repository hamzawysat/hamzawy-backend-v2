name: Backend integration and dependency security tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'frontend-dist/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  push:
    branches: [main, feat/fanni-manual-id-review-profile-photo-20261122]
    paths:
      - 'frontend/**'
      - 'frontend-dist/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build deployed frontend assets before integration tests
        run: npm run build
      - name: Upload generated frontend-dist build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-build
          path: frontend-dist/
          if-no-files-found: error
          retention-days: 1
      - name: Run integration and security tests
        run: npm test
      - name: Check for high and critical dependency vulnerabilities
        run: npm audit --audit-level=high
