name: Backend integration and dependency security tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'frontend-dist/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  push:
    branches: [main, feat/fanni-manual-id-review-profile-photo-20261122]
    paths:
      - 'frontend/**'
      - 'frontend-dist/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build deployed frontend assets before integration tests
        run: npm run build
      - name: Commit generated frontend-dist for this one-time subscription update
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/unified-subscriptions-only-20261127'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-dist
          if ! git diff --cached --quiet; then
            git commit -m "Build frontend-dist for unified subscriptions"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Upload generated frontend-dist for the reviewed branch
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-build
          path: frontend-dist/
          retention-days: 1
      - name: Run integration and security tests
        run: npm test
      - name: Check for high and critical dependency vulnerabilities
        run: npm audit --audit-level=high
