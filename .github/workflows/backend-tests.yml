name: Backend integration and dependency security tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'frontend-dist/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  push:
    branches: [main, feat/fanni-manual-id-review-profile-photo-20261122]
    paths:
      - 'frontend/**'
      - 'frontend-dist/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build deployed frontend assets before integration tests
        run: npm run build
      - name: Commit generated frontend-dist assets to PR branch
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --binary HEAD -- frontend-dist/ > /tmp/frontend-dist-build.patch
          git fetch origin "${BRANCH_NAME}"
          git checkout -B "${BRANCH_NAME}" "origin/${BRANCH_NAME}"
          git apply /tmp/frontend-dist-build.patch
          git add frontend-dist/
          if ! git diff --cached --quiet; then
            git commit -m 'Build frontend-dist for store fixes'
            git push origin "${BRANCH_NAME}"
          else
            echo 'frontend-dist already matches the build output'
          fi
      - name: Run integration and security tests
        run: npm test
      - name: Check for high and critical dependency vulnerabilities
        run: npm audit --audit-level=high
