name: Technician registration regression checks

on:
  push:
    branches:
      - fix/fanni-registration-root-cause-20261122
      - fix/fanni-card-ocr-validation-browser-feedback-20261122
      - fix/fanni-card-ocr-image-enhancement-20261122
      - fix/fanni-remove-manual-card-entry-ui-20261122
      - fix/fanni-ocr-real-card-recovery-20261122
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/js/fanni-registration-scroll.js'
      - 'frontend/js/fanni-render.js'
      - 'frontend/js/fanni-auth.js'
      - 'frontend/fanni.html'
      - 'src/services/fanniCardOcr.js'
      - 'src/routes/fanni.js'
      - 'src/models/FanniCardLedger.js'
      - 'src/tests/**'
      - 'package.json'
      - '.github/workflows/fanni-registration-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python -m pip install -r requirements.txt
      - run: npm run build
      - run: npm run test:registration-ui
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: npm run test:ocr
      - run: npm test
