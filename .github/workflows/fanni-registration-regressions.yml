name: Technician registration regression checks

on:
  push:
    branches:
      - fix/fanni-registration-root-cause-20261122
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:registration-ui
      - run: npm run test:ocr
      - run: npm test
