name: Build frontend-dist on subscriptions branch

on:
  push:
    branches:
      - feat/subscriptions-unified

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/subscriptions-unified
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build frontend distribution
        run: npm run build
      - name: Commit generated frontend assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-dist
          if ! git diff --cached --quiet; then
            git commit -m "Build frontend-dist after subscription collection split"
            git push origin HEAD:feat/subscriptions-unified
          fi
