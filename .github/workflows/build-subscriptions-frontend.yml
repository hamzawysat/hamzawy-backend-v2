name: Build frontend-dist for subscriptions branch

on:
  push:
    branches:
      - feat/subscriptions-unified
    paths:
      - 'frontend/**'
      - 'scripts/build-frontend.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-subscriptions-frontend.yml'

permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/subscriptions-unified
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build generated frontend distribution
        run: npm run build
      - name: Commit generated frontend assets to the same branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-dist
          if ! git diff --cached --quiet; then
            git commit -m "Build frontend-dist for subscriptions-unified"
            git push origin HEAD:feat/subscriptions-unified
          fi
