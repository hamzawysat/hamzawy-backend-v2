name: Build frontend distribution for admin navigation fix

on:
  push:
    branches:
      - fix/global-browser-back-navigation-20261127
    paths:
      - 'frontend/**'
      - 'scripts/build-frontend.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-frontend-dist.yml'

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/global-browser-back-navigation-20261127
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build frontend distribution
        run: npm run build
      - name: Commit generated frontend distribution
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend-dist
          if git diff --cached --quiet; then
            echo "frontend-dist is already up to date"
          else
            git commit -m "Build frontend distribution for admin navigation fix"
            git push origin HEAD:fix/global-browser-back-navigation-20261127
          fi
